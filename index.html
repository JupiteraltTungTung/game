<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jupiter Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .logo {
      font-weight: 600;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 50px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="logo">Jupiter Games</div>
    <div class="nav-links">
      <span>Docs</span>
      <span>API</span>
      <span>Status</span>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <h1>Play Without Limits</h1>
      <p>A fast, minimal, and unblocked gaming hub. Built for speed and simplicity.</p>

      <a class="btn" href="https://sites.google.com/view/jupitergamesunblocked" target="_blank">
        Launch Games
      </a>
    </div>
  </div>

  <div class="footer">
    © 2026 Jupiter Games
  </div>

</body>
</html>
