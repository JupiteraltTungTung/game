<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARNING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #330000 50%, #1a0000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-5px, -5px) rotate(0.5deg); }
            20% { transform: translate(5px, 5px) rotate(-0.5deg); }
            30% { transform: translate(-5px, 5px) rotate(0.5deg); }
            40% { transform: translate(5px, -5px) rotate(-0.5deg); }
            50% { transform: translate(-3px, -3px) rotate(0.3deg); }
            60% { transform: translate(3px, 3px) rotate(-0.3deg); }
            70% { transform: translate(-2px, 2px) rotate(0.2deg); }
            80% { transform: translate(2px, -2px) rotate(-0.2deg); }
            90% { transform: translate(-1px, -1px) rotate(0.1deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes glow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 
                            0 0 40px rgba(255, 0, 0, 0.3),
                            inset 0 0 20px rgba(255, 0, 0, 0.2);
            }
            50% { 
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.8), 
                            0 0 80px rgba(255, 0, 0, 0.5),
                            inset 0 0 40px rgba(255, 0, 0, 0.4);
            }
        }

        .warning-container {
            background: linear-gradient(135deg, #660000 0%, #990000 50%, #660000 100%);
            border: 4px solid #ff0000;
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            max-width: 600px;
            animation: shake 0.5s infinite, glow 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.6);
        }

        .warning-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite;
        }

        h1 {
            color: #ffff00;
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8),
                         0 0 10px rgba(255, 0, 0, 0.6);
            margin-bottom: 20px;
            letter-spacing: 3px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .warning-text {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            line-height: 1.6;
            font-weight: bold;
        }

        .virus-alert {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.8);
        }

        .home-button {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .home-button:hover {
            background: linear-gradient(135deg, #ff3333 0%, #ff0000 100%);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            transform: scale(1.05);
        }

        .home-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="warning-container">
        <div class="warning-icon">⚠️</div>
        <h1>WARNING</h1>
        <div class="warning-text">
            This game has been flagged as a virus by Triple T himself
        </div>
        <div class="virus-alert">
            ⚠️ VIRUS DETECTED ⚠️
        </div>
        <a href="https://sites.google.com/view/jupitergamesunblocked" class="home-button">
            Home
        </a>
    </div>
</body>
</html>
