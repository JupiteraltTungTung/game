<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Baseball Bros</title>

  <!-- FIXED base tag -->
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@ae6706e5224c55594c491edfc7f5ad541e2ea02b/baseball%20bros/">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Game script -->
  <script src="./BaseballBros.js?th=76"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #openfl-content {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: orange;
      font-family: Arial;
    }
  </style>
</head>

<body>

  <div id="loading">Loading game...</div>

  <div id="openfl-content"></div>

  <script>
    window.addEventListener("load", function () {
      try {
        lime.embed("BaseballBros", "openfl-content", 0, 0, {
          parameters: {}
        });

        // hide loading once started
        document.getElementById("loading").style.display = "none";

      } catch (e) {
        console.error("Game failed to start:", e);
        document.getElementById("loading").innerText = "Error loading game";
      }
    });
  </script>

</body>
</html>
